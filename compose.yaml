services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: thanhloi
      POSTGRES_USER: thanhloi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thanhloi"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  database:
